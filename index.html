<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>OPC 龙虾大会 - 活动签到</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 移动端优化 */
    @media (max-width: 768px) {
      html { font-size: 16px; }
      .container { padding-left: 12px; padding-right: 12px; }
    }
    /* 按钮点击反馈 */
    button:active {
      transform: scale(0.95);
      transition: transform 0.1s;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-red-50 to-orange-100 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-md">
    <!-- 头部 Logo -->
    <header class="text-center mb-8">
      <div class="text-6xl mb-4">🦞</div>
      <h1 class="text-4xl font-bold text-gray-800 mb-2">OPC 龙虾大会</h1>
      <p class="text-gray-600 text-lg">欢迎参加本次活动，请签到入场</p>
    </header>

    <!-- 签到表单 -->
    <div id="checkin-form" class="bg-white rounded-2xl shadow-xl p-6 mb-8 animate-fade-in">
      <div class="mb-4">
        <label class="block text-gray-700 font-semibold mb-2">你的姓名</label>
        <input type="text" id="name-input" placeholder="请输入你的姓名" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent">
      </div>
      <div class="mb-5">
        <label class="block text-gray-700 font-semibold mb-2">手机号码</label>
        <input type="tel" id="phone-input" placeholder="请输入你的手机号码" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent">
      </div>
      <button id="checkin-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-lg transition-colors text-lg">
        🦞 点击签到
      </button>
      <div id="loading" class="hidden text-center text-gray-500 mt-4">
        签到中...
      </div>
    </div>

    <!-- 签到结果 -->
    <div id="checkin-result" class="hidden bg-white rounded-2xl shadow-xl p-6 mb-8 animate-fade-in text-center">
      <div id="result-icon" class="text-8xl mb-4"></div>
      <h2 id="result-title" class="text-3xl font-bold text-gray-800 mb-2"></h2>
      <p id="result-message" class="text-xl text-gray-600 mb-6"></p>
      <div id="seat-info" class="bg-yellow-50 rounded-xl p-4 mb-6">
        <p class="text-gray-600">你的座位是</p>
        <p id="seat-number" class="text-4xl font-bold text-yellow-600"></p>
      </div>
      <button id="back-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 px-8 rounded-lg transition-colors">
        返回重新签到
      </button>
    </div>

    <footer class="text-center text-gray-500 text-sm py-8">
      <p>🦞 OPC 龙虾大会 · 签到系统</p>
      <p class="mt-1"><a href="admin.html" class="text-blue-600 hover:underline">后台管理</a></p>
    </footer>
  </div>

  <!-- 欢迎音效 -->
  <audio id="welcome-sound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT" type="audio/wav">
  </audio>

  <script src="app.js"></script>
  <style>
    @keyframes fade-in {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.5s ease-out forwards;
    }
    .hidden {
      display: none !important;
    }
  </style>
</body>
</html>

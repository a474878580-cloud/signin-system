<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>OPC 龙虾大会 - 活动签到</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 移动端优化 */
    @media (max-width: 768px) {
      html { font-size: 16px; }
      .container { padding-left: 12px; padding-right: 12px; }
    }
    /* 签到按钮点击反馈 */
    #checkin-btn:active {
      transform: scale(0.95);
      transition: transform 0.1s;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <header class="text-center mb-8">
      <h1 class="text-4xl font-bold text-gray-800 mb-2">🦞 OPC 龙虾大会</h1>
      <p class="text-gray-600 text-lg">活动签到</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <!-- 签到卡片 -->
      <div class="md:col-span-2 bg-white rounded-xl shadow-md p-6">
        <div class="text-center mb-6">
          <div id="today-date" class="text-2xl font-semibold text-gray-700 mb-2"></div>
          <div id="checkin-status" class="text-lg text-gray-600 mb-4"></div>
          <button id="checkin-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
            点击签到
          </button>
        </div>

        <!-- 签到日历 -->
        <div class="mt-8">
          <h3 class="text-xl font-semibold text-gray-800 mb-4">签到日历</h3>
          <div id="calendar" class="grid grid-cols-7 gap-1 text-center"></div>
        </div>
      </div>

      <!-- 统计信息 -->
      <div class="bg-white rounded-xl shadow-md p-6">
        <h3 class="text-xl font-semibold text-gray-800 mb-4">📊 统计</h3>
        <div class="space-y-4">
          <div class="bg-blue-50 rounded-lg p-4">
            <div class="text-sm text-gray-600">总签到天数</div>
            <div id="total-days" class="text-3xl font-bold text-blue-600">0</div>
          </div>
          <div class="bg-green-50 rounded-lg p-4">
            <div class="text-sm text-gray-600">连续签到</div>
            <div id="current-streak" class="text-3xl font-bold text-green-600">0</div>
          </div>
          <div class="bg-yellow-50 rounded-lg p-4">
            <div class="text-sm text-gray-600">最长连续</div>
            <div id="max-streak" class="text-3xl font-bold text-yellow-600">0</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 排行榜 -->
    <div class="bg-white rounded-xl shadow-md p-6 mb-8">
      <h3 class="text-xl font-semibold text-gray-800 mb-4">🏆 排行榜</h3>
      <div id="leaderboard" class="space-y-2"></div>
    </div>

    <!-- 签到名单管理 -->
    <div class="bg-white rounded-xl shadow-md p-6 mb-8">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-xl font-semibold text-gray-800">📋 签到名单</h3>
        <button id="toggle-list" class="text-blue-600 text-sm hover:text-blue-700">展开/收起</button>
      </div>
      <div id="checkin-list" class="hidden overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b">
              <th class="text-left py-2 px-2">昵称</th>
              <th class="text-right py-2 px-2">总签到天数</th>
              <th class="text-right py-2 px-2">连续签到</th>
            </tr>
          </thead>
          <tbody id="checkin-table-body"></tbody>
        </table>
      </div>
    </div>

    <footer class="text-center text-gray-500 text-sm py-8">
      <p>Built with OpenClaw 🦞</p>
    </footer>
  </div>

  <!-- 登录弹窗（输入昵称） -->
  <div id="name-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full mx-4">
      <h2 class="text-2xl font-bold text-gray-800 mb-2">欢迎参加 OPC 龙虾大会</h2>
      <p class="text-gray-600 mb-4">请输入你的昵称开始签到</p>
      <input type="text" id="name-input" placeholder="输入你的昵称" class="w-full px-4 py-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      <button id="name-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors">开始签到</button>
    </div>
  </div>

  <!-- 签到成功音效 -->
  <audio id="checkin-sound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT" type="audio/wav">
  </audio>

  <script src="app.js"></script>
</body>
</html>
